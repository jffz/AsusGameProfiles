name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore NuGet packages
        run: dotnet restore AsusGameProfiles.sln

      - name: Restore local dotnet tools (WiX)
        run: dotnet tool restore

      - name: Build (Debug)
        run: dotnet build AsusGameProfiles.sln -c Debug --no-restore

      - name: Run tests
        run: dotnet test AsusGameProfiles.sln -c Debug --no-build --logger "console;verbosity=normal"
